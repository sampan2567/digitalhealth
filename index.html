<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กำลังเปลี่ยนเส้นทางไป กลุ่มงานสุขภาพดิจิทัล...</title>

  <!-- 1. Meta Refresh: ให้เปลี่ยนหน้าทันที (0 วินาที) -->
  <meta http-equiv="refresh" content="0; url=https://your-target-url.com/digital-health">

  <!-- 2. Canonical URL สำหรับ SEO -->
  <link rel="canonical" href="https://your-target-url.com/digital-health">

  <!-- 3. JavaScript Redirect (สำรองกรณีเบราว์เซอร์ไม่รองรับ meta refresh) -->
  <script>
    window.location.replace("https://your-target-url.com/digital-health");
  </script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      margin: 0;
      color: #333;
      background-color: #f8fafc;
      text-align: center;
      padding: 1.5rem;
    }
    .card {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      max-width: 480px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #0284c7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.25rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    a {
      color: #0284c7;
      text-decoration: underline;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>กำลังนำท่านเข้าสู่</h2>
    <h3 style="color: #0369a1; margin-top: -0.5rem;">กลุ่มงานสุขภาพดิจิทัล</h3>
    <p style="font-size: 0.95rem; color: #64748b;">
      หากระบบไม่เปลี่ยนหน้าอัตโนมัติ 
      <br>
      <a href="https://your-target-url.com/digital-health">คลิกที่นี่เพื่อไปต่อทันที</a>
    </p>
  </div>
</body>
</html>
